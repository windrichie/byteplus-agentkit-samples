[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "md2html"
version = "1.0.0"
description = "Convert Markdown to polished standalone HTML documents (stdlib only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
md2html = "md2html.cli:main"
