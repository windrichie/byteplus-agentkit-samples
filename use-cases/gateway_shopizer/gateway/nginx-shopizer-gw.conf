# Shopizer legacy-app API gateway (API-key auth + JWT injection)
# Sits in front of the Shopizer container (127.0.0.1:8081) on port 8080.
map $http_x_api_key $shopizer_auth_ok {
    default 0;
    # The live key is NOT committed — it is hosted in the MCP Gateway's
    # credential management and kept locally in .env.local (LEGACY_APP_API_KEY).
    "<LEGACY_APP_API_KEY — the static X-API-Key this gate expects>" 1;
}

server {
    listen 8080 default_server;
    server_name _;

    location / {
        if ($shopizer_auth_ok = 0) {
            add_header Content-Type application/json;
            return 401 '{"error":"invalid or missing X-API-Key"}';
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Admin JWT injected here — the real credential never leaves this VM.
        # Auto-refreshed daily by /usr/local/bin/shopizer-jwt-refresh.sh (7-day tokens).
        proxy_set_header Authorization "Bearer <ADMIN_JWT — filled by shopizer-jwt-refresh.sh>";
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
